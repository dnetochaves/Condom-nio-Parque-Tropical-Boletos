<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletos Agosto 2026 - Pompeu</title>
<style>
  :root {
    --primary: #1F4E78;
    --primary-light: #2E75B6;
    --bg: #F4F6F8;
    --card-bg: #FFFFFF;
    --border: #E0E4E8;
    --text: #222;
    --muted: #6B7280;
    --success: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 20px 16px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.15rem;
  }
  header p {
    margin: 2px 0;
    font-size: 0.8rem;
    color: #D6E4F0;
  }
  .summary {
    max-width: 720px;
    margin: -14px auto 12px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
  }
  .summary .total-val {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--primary);
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 4px 12px 40px;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    margin: 10px 0 14px;
  }
  .filter-bar input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .unidade {
    font-weight: bold;
    font-size: 1rem;
    color: var(--primary);
  }
  .valor {
    font-weight: bold;
    font-size: 1.05rem;
  }
  .meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .barcode-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .barcode-field {
    flex: 1;
    min-width: 0;
    background: #F0F3F6;
    border: 1px dashed #C7D0DA;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: "Courier New", monospace;
    font-size: 0.8rem;
    word-break: break-all;
    color: #333;
  }
  .copy-btn {
    flex-shrink: 0;
    background: var(--primary-light);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 14px;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .copy-btn:active {
    transform: scale(0.97);
  }
  .copy-btn.copied {
    background: var(--success);
  }
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 10px 16px 30px;
  }
  @media (max-width: 400px) {
    .barcode-row { flex-direction: column; }
    .copy-btn { padding: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>Boletos Agosto 2026 — Condomínio Parque Tropical</h1>
  <p>Pagador: Pompeu Fusco Angelico</p>
  <p>Vencimento: 05/08/2026 &nbsp;•&nbsp; Banco 481-2</p>
</header>

<div class="summary">
  <span>29 boletos</span>
  <span class="total-val" id="totalVal">R$ 56.661,72</span>
</div>

<div class="container">
  <div class="filter-bar">
    <input type="text" id="search" placeholder="Buscar unidade...">
  </div>

  <div id="list"></div>
</div>

<footer>Toque em "Copiar" para copiar a linha digitável do boleto.</footer>

<script>
const boletos = [
  {u:"FL 0604", v:1759.78, doc:"566661120", linha:"48190.00003 00495.890568 66611.200149 1 15290000175978"},
  {u:"FL 1103", v:1693.96, doc:"566661707", linha:"48190.00003 00495.890568 66617.070140 2 15290000169396"},
  {u:"FL 1401", v:1759.78, doc:"566661957", linha:"48190.00003 00495.890568 66619.570147 2 15290000175978"},
  {u:"FL 1402", v:1607.12, doc:"566661980", linha:"48190.00003 00495.890568 66619.800148 9 15290000160712"},
  {u:"JD 0102", v:2336.60, doc:"566662345", linha:"48190.00003 00495.890568 66623.450146 6 15290000233660"},
  {u:"JD 0402", v:2482.16, doc:"566662851", linha:"48190.00003 00495.890568 66628.510142 3 15290000248216"},
  {u:"JD 0404", v:2232.99, doc:"566662966", linha:"48190.00003 00495.890568 66629.660144 1 15290000223299"},
  {u:"JD 1104", v:2482.16, doc:"566663868", linha:"48190.00003 00495.890568 66638.680141 9 15290000248216"},
  {u:"JD 1304", v:2232.99, doc:"566664045", linha:"48190.00003 00495.890568 66640.450145 1 15290000223299"},
  {u:"JD 1401", v:3153.15, doc:"566664095", linha:"48190.00003 00495.890568 66640.950144 6 15290000315315"},
  {u:"LG 0703", v:2421.65, doc:"566665383", linha:"48190.00003 00495.890568 66653.830142 1 15290000242165"},
  {u:"LG 1004", v:2482.16, doc:"566665855", linha:"48190.00003 00495.890568 66658.550141 3 15290000248216"},
  {u:"LG 1402", v:3033.15, doc:"566666206", linha:"48190.00003 00495.890568 66662.060145 1 15290000303315"},
  {u:"LU 1104", v:1547.32, doc:"566667688", linha:"48190.00003 00495.890568 66676.880140 5 15290000154732"},
  {u:"LU 1403", v:1547.32, doc:"566667817", linha:"48190.00003 00495.890568 66678.170144 5 15290000154732"},
  {u:"MR 0003", v:2138.46, doc:"566667833", linha:"48190.00003 00495.890568 66678.330144 7 15290000213846"},
  {u:"MR 0103", v:1652.69, doc:"566667860", linha:"48190.00003 00495.890568 66678.600140 1 15290000165269"},
  {u:"MR 1203", v:1729.50, doc:"566668937", linha:"48190.00003 00495.890568 66689.370147 8 15290000172950"},
  {u:"MR 1204", v:1549.25, doc:"566668975", linha:"48190.00003 00495.890568 66689.750140 4 15290000154925"},
  {u:"NT 1104", v:1620.79, doc:"566670503", linha:"48190.00003 00495.890568 66705.030147 3 15290000162079"},
  {u:"NT 1404", v:1776.23, doc:"566670963", linha:"48190.00003 00495.890568 66709.630140 9 15290000177623"},
  {u:"SL 0603", v:1635.43, doc:"566671622", linha:"48190.00003 00495.890568 66716.220141 2 15290000163543"},
  {u:"SL 0903", v:1963.67, doc:"566672236", linha:"48190.00003 00495.890568 66722.360147 2 15290000196367"},
  {u:"SL 1303", v:1579.77, doc:"566672613", linha:"48190.00003 00495.890568 66726.130140 1 15290000157977"},
  {u:"VT 0003", v:1613.45, doc:"566672821", linha:"48190.00003 00495.890568 66728.210148 1 15290000161345"},
  {u:"VT 0204", v:1681.96, doc:"566673765", linha:"48190.00003 00495.890568 66737.650144 1 15290000168196"},
  {u:"VT 0504", v:1555.05, doc:"566674124", linha:"48190.00003 00495.890568 66741.240148 8 15290000155505"},
  {u:"VT 1201", v:1696.59, doc:"566675302", linha:"48190.00003 00495.890568 66753.020149 6 15290000169659"},
  {u:"VT 1304", v:1696.59, doc:"566675443", linha:"48190.00003 00495.890568 66754.430149 3 15290000169659"}
];

boletos.sort((a, b) => {
  const [pa, na] = a.u.split(' ');
  const [pb, nb] = b.u.split(' ');
  return pa.localeCompare(pb) || (parseInt(na, 10) - parseInt(nb, 10));
});

function brl(n) {
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

const listEl = document.getElementById('list');

function render(filter) {
  listEl.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  boletos
    .filter(b => b.u.toLowerCase().includes(f))
    .forEach((b, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="unidade">Unidade ${b.u}</span>
          <span class="valor">${brl(b.v)}</span>
        </div>
        <div class="meta">Doc. ${b.doc} &nbsp;•&nbsp; Venc. 05/08/2026</div>
        <div class="barcode-row">
          <div class="barcode-field" id="code-${i}">${b.linha}</div>
          <button class="copy-btn" data-idx="${i}">Copiar</button>
        </div>
      `;
      listEl.appendChild(card);
    });
}

render('');

document.getElementById('search').addEventListener('input', e => render(e.target.value));

listEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const idx = btn.getAttribute('data-idx');
  const text = document.getElementById('code-' + idx).textContent.trim();
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const original = btn.textContent;
  btn.textContent = 'Copiado!';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1500);
});
</script>

</body>
</html>
