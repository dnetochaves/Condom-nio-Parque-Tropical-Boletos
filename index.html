<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletos Setembro 2026 - Pompeu</title>
<style>
  :root {
    --primary: #1F4E78;
    --primary-light: #2E75B6;
    --bg: #F4F6F8;
    --card-bg: #FFFFFF;
    --border: #E0E4E8;
    --text: #222;
    --muted: #6B7280;
    --success: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 20px 16px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.15rem;
  }
  header p {
    margin: 2px 0;
    font-size: 0.8rem;
    color: #D6E4F0;
  }
  .summary {
    max-width: 720px;
    margin: -14px auto 12px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
  }
  .summary .total-val {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--primary);
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 4px 12px 40px;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    margin: 10px 0 14px;
  }
  .filter-bar input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .unidade {
    font-weight: bold;
    font-size: 1rem;
    color: var(--primary);
  }
  .valor {
    font-weight: bold;
    font-size: 1.05rem;
  }
  .meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .barcode-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .barcode-field {
    flex: 1;
    min-width: 0;
    background: #F0F3F6;
    border: 1px dashed #C7D0DA;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: "Courier New", monospace;
    font-size: 0.8rem;
    word-break: break-all;
    color: #333;
  }
  .copy-btn {
    flex-shrink: 0;
    background: var(--primary-light);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 14px;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .copy-btn:active {
    transform: scale(0.97);
  }
  .copy-btn.copied {
    background: var(--success);
  }
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 10px 16px 30px;
  }
  @media (max-width: 400px) {
    .barcode-row { flex-direction: column; }
    .copy-btn { padding: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>Boletos Setembro 2026 — Condomínio Parque Tropical</h1>
  <p>Pagador: Pompeu Fusco Angelico</p>
  <p>Vencimento: 05/09/2026 &nbsp;•&nbsp; Banco 481-2</p>
</header>

<div class="summary">
  <span>29 boletos</span>
  <span class="total-val" id="totalVal">R$ 59.062,51</span>
</div>

<div class="container">
  <div class="filter-bar">
    <input type="text" id="search" placeholder="Buscar unidade...">
  </div>

  <div id="list"></div>
</div>

<footer>Toque em "Copiar" para copiar a linha digitável do boleto.</footer>

<script>
const boletos = [
  {u:"FL 0604", v:1944.28, doc:"572429722", linha:"48190.00003 00495.890576 24297.220147 9 15630000194428"},
  {u:"FL 1103", v:1688.85, doc:"572429908", linha:"48190.00003 00495.890576 24299.080143 5 15630000168885"},
  {u:"FL 1401", v:1672.12, doc:"572429998", linha:"48190.00003 00495.890576 24299.980144 2 15630000167212"},
  {u:"FL 1402", v:1551.68, doc:"572430003", linha:"48190.00003 00495.890576 24300.030145 6 15630000155168"},
  {u:"JD 0102", v:2453.90, doc:"572430025", linha:"48190.00003 00495.890576 24300.250149 7 15630000245390"},
  {u:"JD 0402", v:2520.99, doc:"572430075", linha:"48190.00003 00495.890576 24300.750148 9 15630000252099"},
  {u:"JD 0404", v:2370.00, doc:"572430095", linha:"48190.00003 00495.890576 24300.950144 1 15630000237000"},
  {u:"JD 1104", v:2682.39, doc:"572430460", linha:"48190.00003 00495.890576 24304.600141 5 15630000268239"},
  {u:"JD 1304", v:2225.78, doc:"572430546", linha:"48190.00003 00495.890576 24305.460149 5 15630000222578"},
  {u:"JD 1401", v:3267.19, doc:"572430550", linha:"48190.00003 00495.890576 24305.500142 8 15630000326719"},
  {u:"LG 0703", v:2544.05, doc:"572430698", linha:"48190.00003 00495.890576 24306.980145 1 15630000254405"},
  {u:"LG 1004", v:2520.99, doc:"572430786", linha:"48190.00003 00495.890576 24307.860148 4 15630000252099"},
  {u:"LG 1402", v:3080.24, doc:"572430855", linha:"48190.00003 00495.890576 24308.550144 1 15630000308024"},
  {u:"LU 1104", v:1554.31, doc:"572431129", linha:"48190.00003 00495.890576 24311.290142 1 15630000155431"},
  {u:"LU 1403", v:1554.31, doc:"572431171", linha:"48190.00003 00495.890576 24311.710149 1 15630000155431"},
  {u:"MR 0003", v:2422.85, doc:"572431190", linha:"48190.00003 00495.890576 24311.900146 9 15630000242285"},
  {u:"MR 0103", v:1839.95, doc:"572431224", linha:"48190.00003 00495.890576 24312.240146 3 15630000183995"},
  {u:"MR 1203", v:2179.70, doc:"572431469", linha:"48190.00003 00495.890576 24314.690140 2 15630000217970"},
  {u:"MR 1204", v:1691.48, doc:"572431470", linha:"48190.00003 00495.890576 24314.700147 8 15630000169148"},
  {u:"NT 1104", v:1741.11, doc:"572431740", linha:"48190.00003 00495.890576 24317.400141 6 15630000174111"},
  {u:"NT 1404", v:1837.32, doc:"572431793", linha:"48190.00003 00495.890576 24317.930147 7 15630000183732"},
  {u:"SL 0603", v:1816.34, doc:"572431902", linha:"48190.00003 00495.890576 24319.020145 8 15630000181634"},
  {u:"SL 0903", v:1990.39, doc:"572431991", linha:"48190.00003 00495.890576 24319.910147 7 15630000199039"},
  {u:"SL 1303", v:1558.31, doc:"572432136", linha:"48190.00003 00495.890576 24321.360141 3 15630000155831"},
  {u:"VT 0003", v:1620.44, doc:"572432171", linha:"48190.00003 00495.890576 24321.710147 9 15630000162044"},
  {u:"VT 0204", v:1691.48, doc:"572432221", linha:"48190.00003 00495.890576 24322.210147 6 15630000169148"},
  {u:"VT 0504", v:1625.66, doc:"572432293", linha:"48190.00003 00495.890576 24322.930140 7 15630000162566"},
  {u:"VT 1201", v:1708.20, doc:"572432469", linha:"48190.00003 00495.890576 24324.690148 5 15630000170820"},
  {u:"VT 1304", v:1708.20, doc:"572432533", linha:"48190.00003 00495.890576 24325.330140 2 15630000170820"},
];

boletos.sort((a, b) => {
  const [pa, na] = a.u.split(' ');
  const [pb, nb] = b.u.split(' ');
  return pa.localeCompare(pb) || (parseInt(na, 10) - parseInt(nb, 10));
});

function brl(n) {
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

const listEl = document.getElementById('list');

function render(filter) {
  listEl.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  boletos
    .filter(b => b.u.toLowerCase().includes(f))
    .forEach((b, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="unidade">Unidade ${b.u}</span>
          <span class="valor">${brl(b.v)}</span>
        </div>
        <div class="meta">Doc. ${b.doc} &nbsp;•&nbsp; Venc. 05/09/2026</div>
        <div class="barcode-row">
          <div class="barcode-field" id="code-${i}">${b.linha}</div>
          <button class="copy-btn" data-idx="${i}">Copiar</button>
        </div>
      `;
      listEl.appendChild(card);
    });
}

render('');

document.getElementById('search').addEventListener('input', e => render(e.target.value));

listEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const idx = btn.getAttribute('data-idx');
  const text = document.getElementById('code-' + idx).textContent.trim();
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const original = btn.textContent;
  btn.textContent = 'Copiado!';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1500);
});
</script>

</body>
</html>
